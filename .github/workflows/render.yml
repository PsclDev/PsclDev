name: Render profile cards

on:
  schedule:
    # daily, so age and service uptimes stay current
    - cron: '0 0 * * *'
  push:
    branches: [master]
    paths: ['scripts/**', 'assets/icons/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Render cards
        run: python3 scripts/render.py

      - name: Commit if changed
        run: |
          git diff --quiet assets && exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets
          git commit -m 'chore: re-render profile cards'
          git push
